<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | فیت‌مارکت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f1;color:#20352a;font:14px Vazirmatn,sans-serif}main{max-width:1100px;margin:36px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top a{color:#56713b}.card{background:white;border:1px solid #e2e8df;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 12px 32px #173b2510}h1{font-size:24px;margin:0}h2{font-size:18px;margin-top:0}.muted{color:#748077;line-height:1.9}.login{max-width:440px;margin:12vh auto}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:grid;gap:6px;color:#526158}input,select{font:inherit;padding:11px;border:1px solid #dce4da;border-radius:10px;width:100%}button{font:inherit;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:#244b36;color:white;font-weight:700}.danger{background:#fff0ed;color:#a33}.actions{display:flex;gap:8px}.notice{padding:12px;border-radius:10px;background:#fff7df;color:#685324;margin:12px 0}.error{color:#ad3a31}.success{color:#367347}.rowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:right;padding:12px;border-bottom:1px solid #edf0eb}th{color:#788278;font-size:12px}td button{padding:7px 12px} [hidden]{display:none!important}@media(max-width:650px){.form{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:15px}.card{padding:16px}}
</style></head><body><main><div class="top"><h1>فیت‌مارکت · پنل مدیریت</h1><a href="./">بازگشت به فروشگاه</a></div><section class="card login" id="login"><h2>ورود مدیر فروشگاه</h2><p class="muted">با ایمیلی که مدیر سامانه برایت ساخته وارد شو.</p><div id="configNotice" class="notice" hidden></div><form id="loginForm"><label>ایمیل<input type="email" name="email" required autocomplete="username"></label><label style="margin-top:12px">رمز عبور<input type="password" name="password" required autocomplete="current-password"></label><button style="width:100%;margin-top:16px">ورود</button></form><p id="loginMsg" class="error"></p></section><section id="dashboard" hidden><div class="card"><div class="rowhead"><div><h2>مدیریت محصولات</h2><span id="welcome" class="muted"></span></div><button id="signout" class="danger">خروج</button></div><div id="msg" class="muted"></div></div><div class="card"><h2 id="formTitle">افزودن محصول</h2><form id="productForm" class="form"><label>شناسه انگلیسی<input name="id" required placeholder="shoe-run"></label><label>نام محصول<input name="name" required></label><label>دسته‌بندی<input name="cat" required></label><label>قیمت (تومان)<input name="price" type="number" min="0" required></label><label>قیمت قبلی<input name="old" type="number" min="0"></label><label>امتیاز<input name="rate" value="۴.۸"></label><label>عکس: شناسه Unsplash یا نشانی کامل<input name="img"></label><label>نشان محصول<input name="badge" value="جدید"></label><label>برچسب‌ها<input name="type" value="new" placeholder="new popular sale"></label><label>ترتیب نمایش<input name="sort_order" type="number" value="10"></label><div class="actions" style="align-self:end"><button>ذخیره محصول</button><button type="reset" class="danger" id="cancelEdit">پاک‌کردن فرم</button></div></form></div><div class="card tablewrap"><table><thead><tr><th>محصول</th><th>دسته</th><th>قیمت</th><th>ترتیب</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="backend-config.js"></script><script>
const cfg=window.FITMARKET_SUPABASE||{},$=s=>document.querySelector(s);let token='',products=[];const headers=()=>({apikey:cfg.publishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'}),api=()=>cfg.url.replace(/\/$/,'')+'/rest/v1';function notice(s,cl=''){ $('#msg').className=cl;$('#msg').textContent=s}if(!cfg.url||!cfg.publishableKey){$('#configNotice').hidden=false;$('#configNotice').textContent='اتصال امن فروشگاه هنوز راه‌اندازی نشده است؛ فایل راهنمای ADMIN-SETUP.md را دنبال کنید.';$('#loginForm').querySelector('button').disabled=true}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);$('#loginMsg').textContent='در حال ورود…';try{let r=await fetch(cfg.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'ایمیل یا رمز عبور درست نیست.');token=d.access_token;let q=await fetch(api()+'/store_admins?select=user_id&user_id=eq.'+encodeURIComponent(d.user.id),{headers:headers()}),a=await q.json();if(!q.ok||!a.length)throw Error('این حساب دسترسی مدیریت ندارد.');$('#login').hidden=true;$('#dashboard').hidden=false;$('#welcome').textContent=d.user.email;await load()}catch(err){token='';$('#loginMsg').textContent=err.message}};
async function load(){let r=await fetch(api()+'/products?select=*&order=sort_order.asc',{headers:headers()});if(!r.ok)throw Error((await r.json()).message||'دریافت محصولات ناموفق بود.');products=await r.json();$('#rows').innerHTML=products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.cat)+'</td><td>'+Number(p.price).toLocaleString('fa-IR')+' تومان</td><td>'+p.sort_order+'</td><td><div class="actions"><button data-edit="'+esc(p.id)+'">ویرایش</button><button class="danger" data-del="'+esc(p.id)+'">حذف</button></div></td></tr>').join('');$('#rows').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(products.find(p=>p.id===b.dataset.edit)));$('#rows').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del));notice(products.length+' محصول بارگذاری شد.','success')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function edit(p){let f=$('#productForm');for(let k of ['id','name','cat','price','old','rate','img','badge','type','sort_order'])f.elements[k].value=p[k]??'';f.elements.id.readOnly=true;$('#formTitle').textContent='ویرایش محصول'}$('#cancelEdit').onclick=()=>{$('#productForm').elements.id.readOnly=false;$('#formTitle').textContent='افزودن محصول'};
$('#productForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),p=Object.fromEntries(f);p.price=Number(p.price);p.old=p.old?Number(p.old):null;p.sort_order=Number(p.sort_order);try{let update=e.currentTarget.elements.id.readOnly,r=await fetch(api()+'/products'+(update?'?id=eq.'+encodeURIComponent(p.id):''),{method:update?'PATCH':'POST',headers:{...headers(),Prefer:'return=minimal'},body:JSON.stringify(p)});if(!r.ok)throw Error((await r.json()).message||'ذخیره انجام نشد');e.currentTarget.reset();e.currentTarget.elements.id.readOnly=false;$('#formTitle').textContent='افزودن محصول';await load()}catch(err){notice(err.message,'error')}};async function remove(id){if(!confirm('این محصول حذف شود؟'))return;let r=await fetch(api()+'/products?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:headers()});if(!r.ok)return notice('حذف انجام نشد.','error');await load()}$('#signout').onclick=async()=>{try{await fetch(cfg.url.replace(/\/$/,'')+'/auth/v1/logout',{method:'POST',headers:headers()})}finally{token='';$('#dashboard').hidden=true;$('#login').hidden=false;$('#loginForm').reset()}};
</script></body></html>
